name: "Event-B Model Validator"
description: "Validate Event-B .zip models using eventb-checker"

inputs:
  model-path:
    description: "Glob pattern for .zip model files to validate"
    required: true
  checker-version:
    description: 'Release tag to download (e.g. "v1.0.0"), or "latest"'
    required: false
    default: "latest"
  show-info:
    description: "Include INFO-severity findings (e.g. well-definedness notes)"
    required: false
    default: "false"
  proofs:
    description: "Check proof status from .bpr/.bpo/.bps files"
    required: false
    default: "false"
  category:
    description: "Code Scanning category for the upload; set it when one repository runs this action more than once"
    required: false
    default: ""
  upload-sarif:
    description: "Upload results to GitHub Code Scanning (needs security-events: write)"
    required: false
    default: "true"

outputs:
  valid:
    description: "Whether all models passed validation (true/false)"
    value: ${{ steps.validate.outputs.valid }}
  error-count:
    description: "Total number of errors across all models"
    value: ${{ steps.validate.outputs.error-count }}
  warning-count:
    description: "Total number of warnings across all models"
    value: ${{ steps.validate.outputs.warning-count }}
  sarif-file:
    description: "Path to the merged SARIF results file"
    value: ${{ steps.validate.outputs.sarif-file }}

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "21"

    - name: Download eventb-checker JAR
      shell: bash
      run: |
        repo="eventb-rossi/eventb-checker"
        version="${{ inputs.checker-version }}"
        if [ "$version" = "latest" ]; then
          api_url="https://api.github.com/repos/$repo/releases/latest"
        else
          api_url="https://api.github.com/repos/$repo/releases/tags/$version"
        fi
        jar_url=$(curl -sfL "$api_url" | jq -r '.assets[] | select(.name | endswith(".jar")) | .browser_download_url')
        if [ -z "$jar_url" ]; then
          echo "::error::Failed to find JAR asset (version: $version) at https://github.com/$repo/releases"
          exit 1
        fi
        curl -sfL -o eventb-checker.jar "$jar_url"
        if [ ! -f eventb-checker.jar ]; then
          echo "::error::Failed to download eventb-checker JAR from $jar_url"
          exit 1
        fi

    - name: Validate models
      id: validate
      shell: bash
      env:
        CHECKER_CMD: "java -jar eventb-checker.jar"
        MODEL_GLOB: ${{ inputs.model-path }}
        SHOW_INFO_FLAG: ${{ inputs.show-info == 'true' && '--show-info' || '' }}
        PROOFS_FLAG: ${{ inputs.proofs == 'true' && '--proofs' || '' }}
      run: bash "${{ github.action_path }}/.github/scripts/validate-models.sh"

    - name: Upload SARIF to Code Scanning
      # A status check of success() is applied to any `if` that names no status
      # function, so listing the conclusions was not enough to run after a failure.
      # sarif-complete is false unless the report covers every matched model, which
      # skips both the empty report Code Scanning rejects outright and the partial
      # one that would make it resolve the alerts of the models that crashed.
      if: ${{ !cancelled() && inputs.upload-sarif == 'true' && steps.validate.outputs.sarif-complete == 'true' }}
      uses: github/codeql-action/upload-sarif@v4.37.4
      with:
        sarif_file: eventb-checker-results.sarif
        # An empty category is read as unset by the upload action.
        category: ${{ inputs.category }}
